<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MITC Industrial AI - Trợ lý thông minh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 25px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
        }

        .chat-header h1 span {
            font-size: 1.8rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8f9fa;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .assistant-message {
            align-self: flex-start;
        }

        .message-content {
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message .message-content {
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .assistant-message .message-content {
            background: white;
            color: #1a1a1a;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 5px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 1.2rem;
            background: #e8eef3;
            color: #1a73e8;
        }

        .user-message .avatar {
            margin-left: 10px;
            margin-right: 0;
            background: #1a73e8;
            color: white;
        }

        .chat-input-area {
            display: flex;
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            gap: 8px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        #chat-input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 15px;
            resize: none;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
            max-height: 120px;
            min-width: 150px;
        }

        #chat-input:focus {
            border-color: #1a73e8;
        }

        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background: #1557b0;
        }

        .image-btn {
            background: #6c757d;
        }

        .image-btn:hover {
            background: #5a6268;
        }

        .drive-btn {
            background: #ff9800;
        }

        .drive-btn:hover {
            background: #e68900;
        }

        .file-btn {
            background: #9c27b0;
        }

        .file-btn:hover {
            background: #7b1fa2;
        }

        .loading {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 10px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 95%;
            }
            .chat-header h1 {
                font-size: 1.2rem;
            }
            button {
                padding: 8px 12px;
                font-size: 12px;
            }
            .chat-input-area {
                gap: 5px;
            }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h1>
            <span>🤖</span> MITC INDUSTRIAL AI
        </h1>
        <p>Trợ lý thông minh hỗ trợ học tập và giảng dạy</p>
        <div class="badge">⚡ Chuyên ngành Điều khiển & Tự động hóa</div>
    </div>

    <div class="chat-messages" id="chat-messages"></div>

    <div class="chat-input-area">
        <textarea id="chat-input" rows="1" placeholder="💬 Nhập câu hỏi của bạn..."></textarea>
        <button id="send-button">📤 Gửi</button>
    </div>
</div>

<script>
    // ============================================================
    // ⚙️ CẤU HÌNH - THAY API KEY CỦA BẠN VÀO ĐÂY
    // ============================================================
    const API_KEY = 'AIzaSyCpCbzGSnqYDp3KdiaAV3ubfiYxx95PWoc';
    // Dùng model ổn định - gemini-2.0-flash
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${API_KEY}`;
    
    // ============================================================
    // HỆ THỐNG PROMPT - ĐỊNH NGHĨA TÍNH CÁCH CHO AI
    // ============================================================
    const SYSTEM_PROMPT = `Bạn là MITC INDUSTRIAL AI, một trợ lý ảo chuyên nghiệp được phát triển bởi giảng viên: Phan Thành Minh và Huỳnh Dương Khánh Linh, Trường Cao đẳng Công Thương Miền Trung (MITC).
    
NHIỆM VỤ CỦA BẠN:
- Hỗ trợ sinh viên và giảng viên trong việc giảng dạy và học tập chuyên ngành Công nghệ Kỹ thuật Điều khiển và Tự động hóa.
- Trả lời các câu hỏi về: Lý thuyết điều khiển, PLC (Siemens, Mitsubishi), Vi điều khiển (Arduino, STM32), Cảm biến, Cơ cấu chấp hành, PID, SCADA, Mạng truyền thông công nghiệp.

PHONG CÁCH:
- Chuyên nghiệp, chính xác, thân thiện
- Ưu tiên giải thích dễ hiểu, có ví dụ minh họa
- Nếu câu hỏi về bài tập, hãy hướng dẫn từng bước, không làm thay toàn bộ
- Nếu không biết câu trả lời chính xác, hãy nói: "Tôi chưa có thông tin đầy đủ về vấn đề này."

GIỚI THIỆU BẢN THÂN KHI ĐƯỢC HỎI: "Tôi là MITC INDUSTRIAL AI - trợ lý ảo chuyên ngành Điều khiển và Tự động hóa, được tạo ra bởi Giảng viên: Phan Thành Minh và Huỳnh Dương Khánh Linh, Trường Cao đẳng Công Thương Miền Trung."`;

    // Lưu lịch sử hội thoại
    let conversationHistory = [
        { role: "user", parts: [{ text: SYSTEM_PROMPT }] },
        { role: "model", parts: [{ text: "OK, tôi đã hiểu vai trò và nhiệm vụ của mình." }] }
    ];
    
    // DOM elements
    const messagesContainer = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    
    // ============================================================
    // HÀM HIỂN THỊ GIAO DIỆN
    // ============================================================
    function addMessageToUI(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}-message`;
        
        if (sender === 'assistant') {
            messageDiv.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="message-content">${formatMessage(text)}</div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="message-content">${formatMessage(text)}</div>
                <div class="avatar">👤</div>
            `;
        }
        
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
    }
    
    function formatMessage(text) {
        return text
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');
    }
    
    function showLoading() {
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loading-message';
        loadingDiv.className = 'message assistant-message';
        loadingDiv.innerHTML = `
            <div class="avatar">🤖</div>
            <div class="message-content" style="background:#f0f0f0;">
                <span>⏳</span> Đang suy nghĩ...
            </div>
        `;
        messagesContainer.appendChild(loadingDiv);
        scrollToBottom();
    }
    
    function hideLoading() {
        const loadingDiv = document.getElementById('loading-message');
        if (loadingDiv) loadingDiv.remove();
    }
    
    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    // ============================================================
    // HÀM GỬI TIN NHẮN ĐẾN GEMINI API
    // ============================================================
    async function sendToGemini(userMessage) {
        conversationHistory.push({ role: "user", parts: [{ text: userMessage }] });
        
        if (conversationHistory.length > 30) {
            conversationHistory = conversationHistory.slice(-20);
        }
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: conversationHistory,
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 2048,
                    }
                })
            });
            
            const data = await response.json();
            
            if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                const botReply = data.candidates[0].content.parts[0].text;
                conversationHistory.push({ role: "model", parts: [{ text: botReply }] });
                return botReply;
            } else {
                console.error('API Error:', data);
                return "❌ Xin lỗi, có lỗi xảy ra. Vui lòng thử lại sau.\n\nChi tiết: " + (data.error?.message || "Không xác định");
            }
        } catch (error) {
            console.error('Network Error:', error);
            return "⚠️ Không thể kết nối đến server. Vui lòng kiểm tra kết nối internet.";
        }
    }
    
    async function handleSendMessage() {
        const userText = chatInput.value.trim();
        if (!userText) return;
        
        chatInput.value = '';
        chatInput.style.height = 'auto';
        
        addMessageToUI(userText, 'user');
        showLoading();
        
        const botResponse = await sendToGemini(userText);
        
        hideLoading();
        addMessageToUI(botResponse, 'assistant');
    }
    
    // ============================================================
    // 📷 CHỨC NĂNG NHẬN DIỆN ẢNH
    // ============================================================
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }
    
    async function sendImageToGemini(imageBase64, question) {
        const base64Data = imageBase64.split(',')[1];
        const mimeMatch = imageBase64.match(/data:image\/(\w+);base64,/);
        const mimeType = mimeMatch ? `image/${mimeMatch[1]}` : 'image/jpeg';
        const userQuestion = question || "Hãy phân tích hình ảnh này về mặt kỹ thuật. Đây là mạch điện gì? Có lỗi gì không?";
        
        const requestBody = {
            contents: [{
                parts: [
                    { inlineData: { mimeType: mimeType, data: base64Data } },
                    { text: userQuestion }
                ]
            }]
        };
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            if (data.candidates && data.candidates[0]) {
                return data.candidates[0].content.parts[0].text;
            }
            return "❌ Không thể phân tích ảnh.";
        } catch (error) {
            return "⚠️ Lỗi phân tích ảnh: " + error.message;
        }
    }
    
    function addImageUploadFeature() {
        const inputArea = document.querySelector('.chat-input-area');
        const sendBtn = document.getElementById('send-button');
        if (!inputArea) return;
        
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'image/*';
        fileInput.style.display = 'none';
        
        const imageButton = document.createElement('button');
        imageButton.innerHTML = '📷';
        imageButton.title = 'Upload ảnh mạch điện, sơ đồ';
        imageButton.classList.add('image-btn');
        
        imageButton.onclick = () => fileInput.click();
        
        fileInput.onchange = async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 5 * 1024 * 1024) {
                addMessageToUI("⚠️ Ảnh quá lớn (tối đa 5MB)", 'assistant');
                return;
            }
            addMessageToUI(`📷 Đã nhận ảnh: "${file.name}"`, 'user');
            showLoading();
            const base64 = await fileToBase64(file);
            const analysis = await sendImageToGemini(base64, null);
            hideLoading();
            addMessageToUI(analysis, 'assistant');
            fileInput.value = '';
        };
        
        if (sendBtn) {
            inputArea.insertBefore(imageButton, sendBtn);
        } else {
            inputArea.appendChild(imageButton);
        }
        document.body.appendChild(fileInput);
    }
    
    // ============================================================
    // XỬ LÝ PHÍM ENTER VÀ KHỞI TẠO
    // ============================================================
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSendMessage();
        }
    });
    
    chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    
    sendButton.addEventListener('click', handleSendMessage);
    
    function addWelcomeMessage() {
        const welcomeText = `Xin chào! 👋

Tôi là **MITC INDUSTRIAL AI**, trợ lý ảo chuyên ngành **Công nghệ Kỹ thuật Điều khiển và Tự động hóa**.

Tôi có thể giúp bạn:
• 📖 Giải thích lý thuyết điều khiển, PLC, Vi điều khiển
• 🔧 Hướng dẫn giải bài tập và thí nghiệm
• 📷 Phân tích ảnh mạch điện, sơ đồ, mã lỗi
• 💡 Gợi ý phương pháp học tập hiệu quả

Hãy bắt đầu bằng cách nhập câu hỏi của bạn bên dưới nhé! 🚀`;
        addMessageToUI(welcomeText, 'assistant');
    }
    
    addWelcomeMessage();
    addImageUploadFeature();
    
    console.log('✅ MITC Industrial AI đã sẵn sàng!');
</script>
</body>
</html>
